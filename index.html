<!DOCTYPE html>
<head>
 <link rel="stylesheet" href="style.css" />  
 </head>
 <body>
 <div class="container">
    <div id="clock">
        <h1>Analog Clock</h1>
        <div class="clockface">
            <div class="number numbertop">12</div>
            <div class="number numberright">3</div>
            <div class="number numberbottom">6</div>
            <div class="number numberleft">9</div>
            <div class="handhourhand"></div>
            <div class="handminhand"></div>
            <div class="handsechand"></div>
        </div>

    </div>
    
 </div>
    
<script src="script.js" ></script>
</body>
</html>
